databases:
  - name: whitespace-hub-db
    plan: basic-256mb
    databaseName: whitespace_hub

services:
  - type: web
    name: whitespace-hub
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter            # a persistent disk needs a paid instance
    healthCheckPath: /healthz
    disk:
      name: whitespace-hub-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      # Hub
      - key: DATABASE_URL
        fromDatabase:
          name: whitespace-hub-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: PUBLIC_URL
        sync: false
      - key: NOTIFY_EMAILS
        sync: false
      - key: SMTP_HOST
        value: smtp.office365.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
      # Carbon platform
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_PATH
        value: /var/data/swcarbon.db
      - key: ANTHROPIC_API_KEY
        sync: false
