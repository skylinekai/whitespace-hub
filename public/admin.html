<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Submissions – Whitespace Hub</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">

<header class="appbar">

  <div class="search" role="search" id="searchWrap" hidden>
    <svg class="i si" viewBox="0 0 20 20" aria-hidden="true"><path d="M8.5 3a5.5 5.5 0 0 1 4.4 8.8l4 4a.5.5 0 0 1-.7.7l-4-4A5.5 5.5 0 1 1 8.5 3Zm0 1a4.5 4.5 0 1 0 0 9 4.5 4.5 0 0 0 0-9Z"/></svg>

      <svg class="i" viewBox="0 0 20 20" aria-hidden="true"><path d="M8.5 2.6a2.2 2.2 0 0 1 3 0l5.3 4.6c.4.4.7.9.7 1.5v7.1c0 1-.8 1.7-1.7 1.7h-2.6c-1 0-1.7-.8-1.7-1.7v-3.3a.5.5 0 0 0-.5-.5H9a.5.5 0 0 0-.5.5v3.3c0 1-.8 1.7-1.7 1.7H4.2c-1 0-1.7-.8-1.7-1.7V8.7c0-.6.3-1.1.7-1.5l5.3-4.6Zm2.3.8a1.2 1.2 0 0 0-1.6 0L3.9 8a1 1 0 0 0-.4.7v7.1c0 .4.3.7.7.7h2.6c.4 0 .7-.3.7-.7v-3.3c0-.8.7-1.5 1.5-1.5h2c.8 0 1.5.7 1.5 1.5v3.3c0 .4.3.7.7.7h2.6c.4 0 .7-.3.7-.7V8.7a1 1 0 0 0-.4-.7l-5.3-4.6Z"/></svg>

      <svg class="i" viewBox="0 0 20 20" aria-hidden="true"><path d="M12 3.5c0-.3-.2-.5-.5-.5h-6C4.1 3 3 4.1 3 5.5v9C3 15.9 4.1 17 5.5 17h6a.5.5 0 0 0 0-1h-6c-.8 0-1.5-.7-1.5-1.5v-9C4 4.7 4.7 4 5.5 4h6c.3 0 .5-.2.5-.5Zm1.9 3.1a.5.5 0 0 0-.8.7l2.2 2.2H8.5a.5.5 0 0 0 0 1h6.8l-2.2 2.2a.5.5 0 0 0 .8.7l3-3a.5.5 0 0 0 0-.8l-3-3Z"/></svg>

  </div>

<div id="app"></div>
<script src="/hub-data.js"></script>
