<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0F6CBD">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Whitespace Hub">
<title>Whitespace Hub</title>
<meta name="description" content="Forms and documents for your day-to-day activities at Whitespace.">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<header class="appbar">
  <button class="bar-btn" id="menuBtn" type="button" aria-label="Show folders" aria-expanded="false" aria-controls="folders">
    <svg class="i" viewBox="0 0 20 20" aria-hidden="true"><path d="M2.5 4h15a.5.5 0 0 1 0 1h-15a.5.5 0 0 1 0-1Zm0 5.5h15a.5.5 0 0 1 0 1h-15a.5.5 0 0 1 0-1Zm0 5.5h15a.5.5 0 0 1 0 1h-15a.5.5 0 0 1 0-1Z"/></svg>
  </button>
  <a class="logo" href="#home" aria-label="Whitespace Hub home"><img src="/logo-white.png" alt="Whitespace"><span class="appname">Hub</span></a>
  <div class="search" role="search">
    <svg class="i si" viewBox="0 0 20 20" aria-hidden="true"><path d="M8.5 3a5.5 5.5 0 0 1 4.4 8.8l4 4a.5.5 0 0 1-.7.7l-4-4A5.5 5.5 0 1 1 8.5 3Zm0 1a4.5 4.5 0 1 0 0 9 4.5 4.5 0 0 0 0-9Z"/></svg>
    <input id="q" type="search" placeholder="Search forms, policies and documents" aria-label="Search the hub" autocomplete="off">
    <button class="clear" id="qClear" type="button" aria-label="Clear search" hidden><svg class="i16" viewBox="0 0 20 20"><path d="m4.1 4.2.1-.1a.5.5 0 0 1 .6 0l.1.1L10 9.3l5.1-5.2a.5.5 0 0 1 .8.7L10.7 10l5.2 5.1c.2.2.2.5 0 .7l-.1.1a.5.5 0 0 1-.6 0l-.1-.1L10 10.7l-5.1 5.2a.5.5 0 0 1-.8-.7L9.3 10 4.1 4.9a.5.5 0 0 1 0-.7Z"/></svg></button>
  </div>
  <div class="bar-end">
    <a class="bar-btn" href="/admin" title="Submissions" aria-label="Submissions">
      <svg class="i" viewBox="0 0 20 20" aria-hidden="true"><path d="M5.4 3h9.2c.9 0 1.6.6 1.9 1.4l1.4 5.3v4.8c0 1.4-1.1 2.5-2.5 2.5h-11A2.5 2.5 0 0 1 2 14.5V9.7l1.4-5.3C3.7 3.6 4.5 3 5.4 3Zm0 1a1 1 0 0 0-1 .7L3.2 9H7c.3 0 .5.2.5.5a2.5 2.5 0 0 0 5 0c0-.3.2-.5.5-.5h3.8l-1.2-4.3a1 1 0 0 0-1-.7H5.4ZM3 10v4.5c0 .8.7 1.5 1.5 1.5h11c.8 0 1.5-.7 1.5-1.5V10h-3.5a3.5 3.5 0 0 1-7 0H3Z"/></svg>
    </a>
  </div>
</header>
<div class="shell">
  <nav class="folders" id="folders" aria-label="Folders"></nav>
  <div class="main"><main class="pane" id="pane" tabindex="-1"></main></div>
</div>
<script src="/hub-data.js"></script>
<script src="/engine.js"></script>
<script src="/app.js"></script>
</body>
</html>
