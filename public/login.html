<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#FFFFFF">
<title>Sign in – Whitespace Hub</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/login.css">
</head>
<body>
<main class="wrap">
  <form class="card" id="f" novalidate>
    <img class="logo" src="/logo-black.png" alt="Whitespace, part of Creaplan Group" width="240" height="61">
    <p class="lead">Sign in to Whitespace Hub.</p>
    <div class="msg" id="msg" role="alert" hidden></div>
    <label for="email">Email</label>
    <input id="email" name="email" type="email" autocomplete="username" inputmode="email" required autofocus>
    <label for="password">Password</label>
    <div class="pw">
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button type="button" id="show" aria-label="Show password" aria-pressed="false">Show</button>
    </div>
    <button class="go" id="go" type="submit">Sign in</button>
    <p class="help">Forgotten your password? Ask an admin to reset it.</p>
  </form>
</main>
<footer class="foot">Whitespace Hub</footer>
<script src="/login.js"></script>
</body>
</html>
