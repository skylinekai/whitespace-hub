{% extends "base.html" %}{% block title %}Account{% endblock %}
{% block content %}
<div class="page-head"><div><h1>Your account</h1><p>{{ user.name }} · {{ user.email }} · {{ user.role }}</p></div></div>
<div class="card" style="max-width:520px">
  <h2>Change password</h2>
  <form method="post" class="stack">
    <input type="hidden" name="_csrf" value="{{ csrf }}">
    <div class="field"><label>Current password</label><input type="password" name="current" required autocomplete="current-password"></div>
    <div class="field"><label>New password</label><input type="password" name="new" minlength="10" required autocomplete="new-password"></div>
    <button class="btn primary">Update password</button>
  </form>
</div>
{% endblock %}
