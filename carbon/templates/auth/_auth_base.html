<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ org_name }} Carbon</title>
  <link rel="icon" href="{{ url_for('static', filename='img/favicon.svg') }}" type="image/svg+xml">
  {% if typekit %}<link rel="stylesheet" href="https://use.typekit.net/{{ typekit }}.css">{% endif %}
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body>
<header class="appbar"><span class="logo"><img src="{{ url_for('static', filename='img/ws-logo-white.png') }}" alt="Whitespace"><span class="appname">Carbon</span></span></header>
<div class="auth-wrap">
  <div class="auth-card">
    <div class="brand-t">Skyline Whitespace Carbon</div>
    {% with msgs = get_flashed_messages(with_categories=true) %}{% for cat, m in msgs %}<div class="flash {{ cat }}">{{ m }}</div>{% endfor %}{% endwith %}
    {% block content %}{% endblock %}
  </div>
</div>
</body>
</html>
