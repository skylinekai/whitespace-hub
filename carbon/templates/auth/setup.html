{% extends "auth/_auth_base.html" %}
{% block content %}
<h1>Set up Carbon</h1>
<p class="muted">Create the first admin account. You can add colleagues afterwards.</p>
<form method="post" class="stack">
  <input type="hidden" name="_csrf" value="{{ csrf }}">
  <div class="field"><label>Your name</label><input type="text" name="name" required></div>
  <div class="field"><label>Work email</label><input type="email" name="email" required></div>
  <div class="field"><label>Password</label><input type="password" name="password" minlength="10" required><span class="hint">At least 10 characters.</span></div>
  <button class="btn primary" style="width:100%;justify-content:center">Create admin account</button>
</form>
{% endblock %}
