{% extends "auth/_auth_base.html" %}
{% block content %}
<h1>Sign in to Carbon</h1>
<p class="muted">Company footprint, stand footprints and reporting.</p>
<form method="post" class="stack">
  <input type="hidden" name="_csrf" value="{{ csrf }}">
  <div class="field"><label for="email">Email</label><input id="email" type="email" name="email" required autofocus autocomplete="username"></div>
  <div class="field"><label for="pw">Password</label><input id="pw" type="password" name="password" required autocomplete="current-password"></div>
  <button class="btn primary" style="width:100%;justify-content:center">Sign in</button>
</form>
<p class="small muted" style="margin-top:16px">No account? Ask your Carbon admin to add you.</p>
{% endblock %}
