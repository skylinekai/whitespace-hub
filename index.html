<style>
/* Layout: navy masthead with search; left rail of departments on desktop, tile grid on home; department pages are indexed sections of rows */
:root{
  --navy:#24215C; --navy-2:#2F2B78; --ink:#16153A; --muted:#5E5C82; --line:#DCDBEA;
  --bg:#F4F4F9; --surface:#FFFFFF; --hover:#ECEBF6; --on-navy:#FFFFFF; --on-navy-dim:#C9C7EA;
  --chip-form:#E4E2FA; --chip-form-fg:#24215C; --chip-doc:#EEF0F3; --chip-doc-fg:#3D4352; --chip-link:#E1F1FB; --chip-link-fg:#0B5A86;
  --star:#E0A100; --focus:#5B55E0;
  --f-body:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --navy:#1B1947; --navy-2:#2A2668; --ink:#EDECF8; --muted:#A3A1C6; --line:#33315C;
  --bg:#110F2A; --surface:#1A1838; --hover:#24224A; --on-navy:#FFFFFF; --on-navy-dim:#B4B1E0;
  --chip-form:#2E2A6E; --chip-form-fg:#D9D6FF; --chip-doc:#2A2A3E; --chip-doc-fg:#C8CBD6; --chip-link:#173A52; --chip-link-fg:#9DD6F7;
  --star:#F2C14E; --focus:#A9A4FF; color-scheme:dark}}
:root[data-theme="dark"]{
  --navy:#1B1947; --navy-2:#2A2668; --ink:#EDECF8; --muted:#A3A1C6; --line:#33315C;
  --bg:#110F2A; --surface:#1A1838; --hover:#24224A; --on-navy:#FFFFFF; --on-navy-dim:#B4B1E0;
  --chip-form:#2E2A6E; --chip-form-fg:#D9D6FF; --chip-doc:#2A2A3E; --chip-doc-fg:#C8CBD6; --chip-link:#173A52; --chip-link-fg:#9DD6F7;
  --star:#F2C14E; --focus:#A9A4FF; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--navy)}
a{color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:6px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* masthead */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--navy);color:var(--on-navy)}
header.top .wrap{display:flex;align-items:center;gap:16px;padding-block:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--on-navy);flex:none}
.mark{width:34px;height:34px;border-radius:8px;background:var(--on-navy);color:#24215C;display:grid;place-items:center;font-weight:800;font-size:14px;letter-spacing:-.02em}
.brand b{font-size:17px;font-weight:700;letter-spacing:-.01em}
.brand small{display:block;font-size:11px;color:var(--on-navy-dim);letter-spacing:.06em;text-transform:uppercase;font-weight:600}
.search{flex:1 1 280px;position:relative;min-width:0}
.search input{width:100%;height:42px;border-radius:999px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.1);color:var(--on-navy);padding:0 40px 0 40px;font:inherit;font-size:15px}
.search input::placeholder{color:var(--on-navy-dim)}
.search input:focus{outline:none;background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.45)}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--on-navy-dim)}
.search kbd{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-family:var(--f-mono);font-size:11px;color:var(--on-navy-dim);border:1px solid rgba(255,255,255,.25);border-radius:5px;padding:1px 6px}

/* shell */
.shell{display:grid;grid-template-columns:230px minmax(0,1fr);gap:32px;padding-block:28px 64px}
nav.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 86px);align-self:start;display:flex;flex-direction:column;gap:2px;max-height:calc(100vh - 110px);overflow:auto}
nav.rail a{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:8px;text-decoration:none;color:var(--muted);font-weight:500;font-size:14px}
nav.rail a:hover{background:var(--hover);color:var(--ink)}
nav.rail a[aria-current="page"]{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:0 0 0 1px var(--line)}
nav.rail .sw{width:10px;height:10px;border-radius:3px;flex:none}
nav.rail .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;padding:14px 10px 6px}
nav.rail .count{margin-left:auto;font-family:var(--f-mono);font-size:11px;color:var(--muted)}
@media (max-width:860px){.shell{grid-template-columns:minmax(0,1fr);padding-block:20px 48px}nav.rail{display:none}}

/* home */
.hello h1{font-size:clamp(26px,3.4vw,36px);line-height:1.15;letter-spacing:-.02em;margin:0 0 6px;text-wrap:balance}
.hello p{margin:0;color:var(--muted);max-width:60ch}
.quick{display:flex;flex-wrap:wrap;gap:10px;margin:22px 0 32px}
.quick a{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:999px;background:var(--navy);color:var(--on-navy);text-decoration:none;font-weight:600;font-size:14px}
.quick a:hover{background:var(--navy-2)}
.quick a svg{width:14px;height:14px;stroke:currentColor}
h2.sec{font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:0 0 12px;font-weight:700}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.tile{position:relative;display:flex;flex-direction:column;gap:14px;padding:16px 16px 14px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);text-decoration:none;min-height:124px;overflow:hidden;transition:transform .15s ease,border-color .15s}
.tile::before{content:"";position:absolute;inset:0 0 auto;height:5px;background:var(--c)}
.tile:hover{transform:translateY(-2px);border-color:var(--c)}
.tile b{font-size:17px;font-weight:700;letter-spacing:-.01em;line-height:1.25}
.tile .meta{margin-top:auto;display:flex;gap:10px;font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
.favs{margin-bottom:32px}

/* department page */
.crumb{font-size:13px;color:var(--muted);margin-bottom:6px}
.crumb a{text-decoration:none;font-weight:600}
.crumb a:hover{text-decoration:underline}
.dhead{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;padding-bottom:18px;border-bottom:3px solid var(--c);margin-bottom:8px}
.dhead h1{margin:0;font-size:clamp(26px,3.4vw,36px);letter-spacing:-.02em;line-height:1.1}
.dhead .meta{font-family:var(--f-mono);font-size:12px;color:var(--muted);padding-bottom:4px}
.jump{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 6px}
.jump a{font-size:13px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);text-decoration:none;color:var(--muted);background:var(--surface)}
.jump a:hover{color:var(--ink);border-color:var(--muted)}
section.grp{padding-top:22px;scroll-margin-top:90px}
section.grp h3{margin:0 0 8px;font-size:15px;font-weight:700;display:flex;align-items:baseline;gap:8px}
section.grp h3 span{font-family:var(--f-mono);font-size:11px;color:var(--muted);font-weight:500}
.note{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin:0 0 8px;max-width:72ch;color:var(--ink)}
.note p{margin:0 0 8px}.note p:last-child{margin:0}
.note ul{margin:4px 0 8px;padding-left:20px}

/* rows */
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:0 6px 0 14px;border-top:1px solid var(--line);min-height:52px}
.row:first-child{border-top:0}
.row:hover{background:var(--hover)}
.row a.go{flex:1;min-width:0;display:flex;align-items:center;gap:12px;text-decoration:none;padding-block:10px}
.row .tt{min-width:0;flex:1}
.row .tt b{display:block;font-weight:600;font-size:15px;overflow-wrap:anywhere}
.row .tt small{display:block;color:var(--muted);font-size:13px}
.chip{flex:none;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;padding:3px 7px;border-radius:5px;min-width:46px;text-align:center}
.chip.form{background:var(--chip-form);color:var(--chip-form-fg)}
.chip.doc{background:var(--chip-doc);color:var(--chip-doc-fg)}
.chip.link{background:var(--chip-link);color:var(--chip-link-fg)}
.row .dept{flex:none;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.row .dept i{width:8px;height:8px;border-radius:2px;background:var(--c)}
.ext{flex:none;width:14px;height:14px;stroke:var(--muted)}
.star{flex:none;width:36px;height:36px;border:0;background:none;border-radius:8px;cursor:pointer;display:grid;place-items:center;color:var(--muted)}
.star:hover{background:var(--bg)}
.star svg{width:17px;height:17px;stroke:currentColor;fill:none}
.star[aria-pressed="true"]{color:var(--star)}
.star[aria-pressed="true"] svg{fill:currentColor}
@media (max-width:560px){.row .dept{display:none}.ext{display:none}}

/* search results */
.filters{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px}
.filters button{font:inherit;font-size:13px;padding:5px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:var(--on-navy)}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
mark{background:#FFE58A;color:#16153A;border-radius:2px;padding:0 1px}
footer{color:var(--muted);font-size:12.5px;padding-block:0 32px}
@media (prefers-reduced-motion:reduce){.tile{transition:none}.tile:hover{transform:none}}
</style>

// departments on the home grid (matches the original hub); the rest live in the sidebar
const HOME=['office-management','hr','finance','project-management','operations','xpo','sales-marketing','health-safety','production','sustainability','benefits','policies','custom'];
const QUICK=[['Photo Upload','242604475360353'],['Onsite Feedback Form','240372600726046'],['Suggestion Box','240213709659358'],['Incident Report','233304819981058']];

// ---------- data prep ----------
const byId=Object.fromEntries(D.map(d=>[d.id,d]));
const ALL=[];
D.forEach(d=>d.g.forEach(([h,items])=>items.forEach((it,i)=>{
  const [k,t,u,m]=it; if(k==='n')return;
  let url=u, type;
  if(k==='f'){url='https://form.jotform.com/'+u;type='form'}
  else if(k==='l'){type='link'}
  else if(k==='p'){url='#'+u;type='page'}
  else {if(u.startsWith('~'))url=U+u.slice(1);type='doc'}
  const ext=k==='d'?(url.split('?')[0].split('.').pop()||'').toLowerCase():'';
  const key=type+':'+url;
  ALL.push({key,type,t,url,m:m||'',ext,dept:d,h});
})));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const counts=d=>{const r={form:0,doc:0,link:0};ALL.filter(x=>x.dept===d&&x.type!=='page').forEach(x=>r[x.type]++);return r};

// ---------- favourites (per browser) ----------
let favs=[];
try{favs=JSON.parse(localStorage.getItem('wsh-favs')||'[]')}catch(e){favs=[]}
const saveFavs=()=>{try{localStorage.setItem('wsh-favs',JSON.stringify(favs))}catch(e){}};

// ---------- rendering ----------
const IC={ext:'<svg class="ext" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>',
 arrow:'<svg class="ext" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>',
 star:'<svg viewBox="0 0 24 24" stroke-width="1.8" stroke-linejoin="round"><path d="m12 3.5 2.6 5.4 5.9.8-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.3-4.1 5.9-.8z"/></svg>',
 bolt:'<svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>'};
const chipFor=x=>x.type==='form'?'<span class="chip form">Form</span>':x.type==='link'?'<span class="chip link">Link</span>':x.type==='page'?'<span class="chip link">Page</span>':'<span class="chip doc">'+esc(x.ext||'file')+'</span>';
const hl=(s,q)=>{s=esc(s);if(!q)return s;const i=s.toLowerCase().indexOf(q.toLowerCase());return i<0?s:s.slice(0,i)+'<mark>'+s.slice(i,i+q.length)+'</mark>'+s.slice(i+q.length)};

function row(x,{showDept=false,q=''}={}){
  const internal=x.type==='page';
  const fav=favs.includes(x.key);
  return `<div class="row" style="--c:${x.dept.c}">
    <a class="go" href="${esc(x.url)}"${internal?'':' target="_blank" rel="noopener"'}>
      ${chipFor(x)}
      <span class="tt"><b>${hl(x.t,q)}</b>${x.m?`<small>${hl(x.m,q)}</small>`:''}</span>
      ${showDept?`<span class="dept"><i></i>${esc(x.dept.name)}</span>`:''}
      ${internal?IC.arrow:IC.ext}
    </a>
    ${internal?'':`<button class="star" type="button" data-fav="${esc(x.key)}" aria-pressed="${fav}" aria-label="${fav?'Remove from':'Add to'} favourites: ${esc(x.t)}">${IC.star}</button>`}
  </div>`;
}

function renderRail(active){
  const link=d=>{const n=ALL.filter(x=>x.dept===d&&x.type!=='page').length;return `<a href="#${d.id}"${d.id===active?' aria-current="page"':''}><span class="sw" style="background:${d.c}"></span>${esc(d.name)}<span class="count">${n||''}</span></a>`};
  document.getElementById('rail').innerHTML=
    `<a href="#home"${active==='home'?' aria-current="page"':''}><span class="sw" style="background:var(--navy)"></span>Home</a>
     <div class="lbl">Departments</div>${HOME.map(id=>link(byId[id])).join('')}
     <div class="lbl">More</div>${['how-to-guides','essa-discount-card'].map(id=>link(byId[id])).join('')}`;
}

function renderHome(){
  const fv=favs.map(k=>ALL.find(x=>x.key===k)).filter(Boolean);
  const nForms=ALL.filter(x=>x.type==='form').length, nDocs=ALL.filter(x=>x.type==='doc').length;
  return `<div class="hello"><h1>Whitespace Hub</h1><p>Forms and documents for your day-to-day activities. ${nForms} forms and ${nDocs} documents across ${HOME.length} departments.</p></div>
  <div class="quick">${QUICK.map(([t,id])=>`<a href="https://form.jotform.com/${id}" target="_blank" rel="noopener">${IC.bolt}${esc(t)}</a>`).join('')}</div>
  ${fv.length?`<div class="favs"><h2 class="sec">Your favourites</h2><div class="list">${fv.map(x=>row(x,{showDept:true})).join('')}</div></div>`:''}
  <h2 class="sec">Departments</h2>
  <div class="tiles">${HOME.map(id=>{const d=byId[id],c=counts(d);
    const parts=[c.form&&`${c.form} form${c.form>1?'s':''}`,c.doc&&`${c.doc} doc${c.doc>1?'s':''}`,c.link&&`${c.link} link${c.link>1?'s':''}`].filter(Boolean);
    return `<a class="tile" href="#${d.id}" style="--c:${d.c}"><b>${esc(d.name)}</b><span class="meta">${parts.join(' · ')}</span></a>`}).join('')}</div>`;
}

function renderDept(d){
  const c=counts(d);
  const slug=s=>d.id+'--'+s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
  const parts=[c.form&&`${c.form} forms`,c.doc&&`${c.doc} documents`,c.link&&`${c.link} links`].filter(Boolean);
  return `<div class="crumb"><a href="#home">Home</a> / ${esc(d.name)}</div>
  <div class="dhead" style="--c:${d.c}"><h1>${esc(d.name)}</h1><span class="meta">${parts.join(' · ')}</span></div>
  ${d.g.length>3?`<div class="jump">${d.g.map(([h])=>`<a href="#${d.id}" data-jump="${slug(h)}">${esc(h)}</a>`).join('')}</div>`:''}
  ${d.g.map(([h,items])=>{
    const notes=items.filter(i=>i[0]==='n').map(i=>`<div class="note">${i[1]}</div>`).join('');
    const rows=ALL.filter(x=>x.dept===d&&x.h===h);
    return `<section class="grp" id="${slug(h)}"><h3>${esc(h)}${rows.length?`<span>${rows.length}</span>`:''}</h3>${notes}${rows.length?`<div class="list">${rows.map(x=>row(x)).join('')}</div>`:''}</section>`}).join('')}`;
}

let filter='all';
function renderSearch(q){
  const ql=q.toLowerCase();
  let hits=ALL.filter(x=>x.type!=='page'&&(x.t+' '+x.m+' '+x.h+' '+x.dept.name+' '+x.ext).toLowerCase().includes(ql));
  const n={all:hits.length,form:hits.filter(x=>x.type==='form').length,doc:hits.filter(x=>x.type==='doc').length,link:hits.filter(x=>x.type==='link').length};
  if(filter!=='all')hits=hits.filter(x=>x.type===filter);
  hits.sort((a,b)=>(b.t.toLowerCase().includes(ql))-(a.t.toLowerCase().includes(ql)));
  const btn=(k,l)=>`<button type="button" data-filter="${k}" aria-pressed="${filter===k}">${l} · ${n[k]}</button>`;
  return `<h2 class="sec">Results for “${esc(q)}”</h2>
  <div class="filters">${btn('all','All')}${btn('form','Forms')}${btn('doc','Documents')}${btn('link','Links')}</div>
  <div class="list">${hits.length?hits.map(x=>row(x,{showDept:true,q})).join(''):`<div class="empty">Nothing matches “${esc(q)}”. Try a shorter word, like “toil” or “policy”.</div>`}</div>`;
}

const view=document.getElementById('view'), qi=document.getElementById('q');
function route(){
  const q=qi.value.trim();
  const id=(location.hash||'#home').slice(1);
  const d=byId[id];
  renderRail(d?d.id:'home');
  if(q){view.innerHTML=renderSearch(q);return}
  view.innerHTML=d?renderDept(d):renderHome();
}
window.addEventListener('hashchange',()=>{qi.value='';filter='all';route();window.scrollTo(0,0)});
qi.addEventListener('input',()=>{filter='all';route()});
document.addEventListener('keydown',e=>{
  if(e.key==='/'&&document.activeElement!==qi&&!/input|textarea/i.test(document.activeElement.tagName)){e.preventDefault();qi.focus()}
  if(e.key==='Escape'&&document.activeElement===qi){qi.value='';route()}
});
view.addEventListener('click',e=>{
  const s=e.target.closest('[data-fav]');
  if(s){const k=s.dataset.fav;favs=favs.includes(k)?favs.filter(x=>x!==k):[...favs,k];saveFavs();
    const on=favs.includes(k);s.setAttribute('aria-pressed',on);s.setAttribute('aria-label',(on?'Remove from':'Add to')+' favourites');
    if(!qi.value&&(location.hash||'#home')==='#home')route();return}
  const f=e.target.closest('[data-filter]');
  if(f){filter=f.dataset.filter;route();return}
  const j=e.target.closest('[data-jump]');
  if(j){e.preventDefault();document.getElementById(j.dataset.jump)?.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'})}
});
route();
</script>
